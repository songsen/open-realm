// Opt-in low-end rendering preset for GPU-bound machines.
//
//   build/bin/openwarcraft3 -data "C:\path\to\Warcraft III" +exec low.cfg
//
// This only changes renderer cost knobs. Window size and vsync stay in
// config.cfg because they are applied before the renderer initializes, while
// these cvars are read every frame.

// Per-unit ground shadows: one batched splat draw per texture run, but it still
// scales with the number of visible units.
seta r_unit_shadows "0"

// Particles and dynamic lights are the most expensive per-frame effects during
// large fights. Both are purely visual.
seta r_particles "0"
seta r_lights "0"

// r_fogofwar 0 removes the visibility overlay entirely, which also reveals the
// map. Enable it only for renderer benchmarks, never for normal play:
// seta r_fogofwar "0"

// Uncomment to print fps/draw/vertex counters once per second:
// seta r_stats "1"

// Re-apply the current window mode after changing any vid_* cvar:
// vid_apply